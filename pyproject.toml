[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[project]
name = "warpx-geometry"
version = "0.1.0"
authors = [
   { name = "Arun Persaud", email = "apersaud@lbl.gov" },
]
description = "Simple geometry objects for WarpX embedded boundaries"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
     "matplotlib>=3.5",
     "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/FSIBT/warpx-geometry"
Documentation = "https://github.com/FSIBT/warpx-geometry#readme"
Repository = "https://github.com/FSIBT/warpx-geometry"
Issues = "https://github.com/FSIBT/warpx-geometry/issues"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=warpx_geometry --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = ["E741"]  # ambiguous variable name

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80
